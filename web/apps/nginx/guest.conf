# The guest menu under /m/ (the path QR codes print). Hashed files are immutable; the page itself is revalidated, so a
# deployment reaches guests on their next scan.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server's headers, so every location includes them itself.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /m/assets/ {
        include /etc/nginx/security-headers.conf;
        # Without "always": a 404 for a file of an older deployment must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /m/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /m/index.html;
    }

    location = / {
        return 302 /m/;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        return 404;
    }
}
