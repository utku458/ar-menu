# The dashboard, a single-page app: unknown paths get index.html and are routed in the browser.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server's headers, so every location includes them itself.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, served under the dashboard's own origin.
    #
    # The refresh token is an HttpOnly, Secure, SameSite=Strict cookie, so a browser sends it only on same-site
    # requests. That is exactly right when the two live under one registrable domain (app.armenu.app and
    # api.armenu.app), and impossible when they do not: Railway's generated domains are each their own site, because
    # up.railway.app is on the Public Suffix List, so a cross-origin dashboard could sign in and then never refresh.
    # Proxying here removes the question — the cookie is first-party and CORS is not involved at all.
    #
    # Dormant unless API_ORIGIN is set (see apps/Dockerfile): a deployment that gives the app an absolute
    # VITE_API_BASE_URL never sends a request through this location.
    location /api/ {
        # The upstream is resolved per request, from the container's own resolver, so a redeployed API that comes
        # back on a different private address is followed instead of cached until nginx restarts.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        set $api_origin "${API_ORIGIN}";

        # A variable in proxy_pass turns off nginx's own URI rewriting, so the original path is passed explicitly.
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        # Only used when API_ORIGIN is an https:// URL: without SNI the upstream's certificate cannot be matched.
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Railway's edge terminates TLS; without this the API would believe the request arrived over plain HTTP.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Menus can be imported as a spreadsheet; everything larger (models, images) is uploaded straight to storage.
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # Without "always": a 404 for a file of an older deployment must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
