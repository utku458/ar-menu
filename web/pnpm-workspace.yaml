packages:
  - apps/*
  - packages/*
  - services/*
  - tools/*

peerDependencyRules:
  allowedVersions:
    # Verified to lint correctly on ESLint 10; the plugin has not widened its peer range yet.
    eslint-plugin-jsx-a11y>eslint: '10'
    # Only the TypeScript printer API is used, which is unchanged in TypeScript 6.
    openapi-typescript>typescript: '6'

# One version per dependency across the workspace, referenced as "catalog:" (the counterpart of the .NET side's
# Central Package Management in Directory.Packages.props).
catalog:
  # Runtime
  '@google/model-viewer': 4.3.1
  '@tanstack/react-query': 5.102.8
  '@tanstack/react-router': 1.170.36
  openapi-fetch: 0.17.0
  react: 19.3.0
  react-aria-components: 1.21.1
  react-dom: 19.3.0
  # model-viewer 4.3 requires three 0.183.x.
  three: 0.183.2
  uqr: 0.1.3

  # Build
  # babel-plugin-react-compiler 1.0 is built on Babel 7.
  '@babel/core': 7.29.7
  '@rolldown/plugin-babel': 0.2.4
  '@tailwindcss/vite': 4.3.3
  '@vitejs/plugin-react': 6.1.1
  babel-plugin-react-compiler: 1.0.0
  openapi-typescript: 7.13.0
  tailwindcss: 4.3.3
  # typescript-eslint supports TypeScript < 6.1; TypeScript 7 (native) is not supported by it yet.
  typescript: 6.0.3
  vite: 8.3.0

  # Asset pipeline
  '@gltf-transform/core': 4.5.0
  '@gltf-transform/extensions': 4.5.0
  '@gltf-transform/functions': 4.5.0
  draco3dgltf: 1.5.7
  # The encoder must not be newer than the decoder guests run: three 0.183 bundles meshoptimizer 1.0.
  meshoptimizer: 1.0.1
  playwright-core: 1.63.0
  sharp: 0.35.4

  # Types
  '@types/draco3dgltf': 1.4.3
  '@types/node': 26.5.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/three': 0.183.1

  # Quality
  '@axe-core/playwright': 4.13.0
  '@eslint/js': 10.0.1
  '@playwright/test': 1.63.0
  '@tanstack/eslint-plugin-query': 5.102.8
  eslint: 10.10.0
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.6
  globals: 17.12.0
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1
  typescript-eslint: 8.70.0
  vitest: 5.0.0

minimumReleaseAgeExclude:
  - '@tanstack/history@1.162.4'
  - '@tanstack/react-router@1.170.36'
  - '@tanstack/router-core@1.171.30'
